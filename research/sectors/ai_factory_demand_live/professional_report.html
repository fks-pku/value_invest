<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>AI 工厂需求侧前景｜动态研究工作台</title>
    <style>
      :root {
        --paper: #f2efe7;
        --surface: #fffdfa;
        --ink: #18211d;
        --muted: #66716b;
        --line: #d7d7cc;
        --line-strong: #a6ada7;
        --green: #165c45;
        --green-soft: #e5efe9;
        --amber: #8a5a11;
        --amber-soft: #f6ebd1;
        --red: #8f3d34;
        --shadow: 0 20px 54px rgba(25, 42, 34, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 92% 0, rgba(22, 92, 69, 0.09), transparent 28rem),
          linear-gradient(rgba(24, 33, 29, 0.022) 1px, transparent 1px),
          var(--paper);
        background-size: auto, 100% 34px, auto;
        font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        line-height: 1.72;
      }

      button {
        font: inherit;
      }

      a {
        color: var(--green);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .page {
        width: min(1440px, calc(100% - 40px));
        margin: 0 auto;
        padding: 36px 0 58px;
      }

      .report-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 30px;
        align-items: end;
        margin-bottom: 24px;
        padding: 0 3px 20px;
        border-bottom: 2px solid var(--ink);
      }

      .eyebrow {
        margin: 0 0 7px;
        color: var(--green);
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 7px;
        font-family: "Iowan Old Style", "Songti SC", "STSong", serif;
        font-size: clamp(34px, 4.5vw, 58px);
        font-weight: 650;
        letter-spacing: -0.035em;
        line-height: 1.08;
      }

      .deck {
        max-width: 780px;
        margin-bottom: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .meta {
        display: grid;
        gap: 4px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        text-align: right;
      }

      .workspace {
        display: grid;
        grid-template-columns: 310px minmax(0, 1fr);
        gap: 22px;
        align-items: start;
      }

      .tree-pane {
        position: sticky;
        top: 18px;
        min-height: 620px;
        padding: 22px 18px;
        color: #d5e2dc;
        background: #183c31;
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .pane-kicker {
        margin-bottom: 4px;
        color: #acd0c0;
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .tree-pane h2 {
        margin-bottom: 18px;
        color: #f4f7f5;
        font-family: "Iowan Old Style", "Songti SC", "STSong", serif;
        font-size: 22px;
      }

      .tree-list,
      .tree-list ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .tree-list ul {
        position: relative;
        margin-left: 11px;
        padding-left: 18px;
      }

      .tree-list ul::before {
        position: absolute;
        top: -3px;
        bottom: 18px;
        left: 0;
        width: 1px;
        background: rgba(223, 238, 231, 0.28);
        content: "";
      }

      .tree-list li {
        position: relative;
        margin: 3px 0;
      }

      .tree-list ul > li::before {
        position: absolute;
        top: 23px;
        left: -18px;
        width: 15px;
        height: 1px;
        background: rgba(223, 238, 231, 0.28);
        content: "";
      }

      .tree-item {
        display: grid;
        grid-template-columns: 39px minmax(0, 1fr) 8px;
        gap: 7px;
        align-items: start;
        width: 100%;
        padding: 9px 8px;
        color: #d5e2dc;
        background: transparent;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        text-align: left;
        transition: background 150ms ease, color 150ms ease, transform 150ms ease;
      }

      .tree-item:hover {
        color: white;
        background: rgba(255, 255, 255, 0.075);
      }

      .tree-item:focus-visible {
        outline: 2px solid #bddcca;
        outline-offset: 2px;
      }

      .tree-item.is-on-path {
        color: #e7f1ec;
        background: rgba(255, 255, 255, 0.045);
      }

      .tree-item.is-active {
        color: #173c30;
        background: #f2ead8;
        transform: translateX(3px);
      }

      .tree-level {
        padding-top: 2px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 9px;
        font-weight: 850;
      }

      .tree-question {
        font-size: 11px;
        font-weight: 650;
        line-height: 1.5;
      }

      .tree-status {
        width: 7px;
        height: 7px;
        margin-top: 6px;
        background: #78bf9e;
        border-radius: 50%;
      }

      .tree-status.was-expanded {
        background: #e1a946;
      }

      .tree-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 21px 8px 0;
        padding-top: 14px;
        color: #b9cbc2;
        border-top: 1px solid rgba(223, 238, 231, 0.16);
        font-size: 9px;
      }

      .tree-legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .tree-legend i {
        display: inline-block;
        margin: 0;
      }

      .detail-pane {
        min-width: 0;
        min-height: 620px;
        padding: 38px 42px 34px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .node-detail {
        animation: reveal 230ms ease-out both;
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .breadcrumb {
        margin-bottom: 15px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.03em;
      }

      .breadcrumb span + span::before {
        margin: 0 8px;
        color: var(--line-strong);
        content: "→";
      }

      .detail-title-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 20px;
        align-items: start;
        padding-bottom: 24px;
        border-bottom: 2px solid var(--ink);
      }

      .node-id {
        margin-bottom: 8px;
        color: var(--green);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.08em;
      }

      .detail-title {
        max-width: 900px;
        margin-bottom: 0;
        font-family: "Iowan Old Style", "Songti SC", "STSong", serif;
        font-size: clamp(26px, 3.4vw, 42px);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.28;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 10px;
        color: var(--green);
        background: var(--green-soft);
        border-radius: 999px;
        font-size: 10px;
        font-weight: 850;
        white-space: nowrap;
      }

      .status-badge::before {
        width: 7px;
        height: 7px;
        background: currentColor;
        border-radius: 50%;
        content: "";
      }

      .status-badge.expanded {
        color: var(--amber);
        background: var(--amber-soft);
      }

      .chapter-index {
        display: flex;
        flex-wrap: wrap;
        gap: 7px 17px;
        margin: 19px 0 3px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }

      .chapter-index button {
        padding: 0;
        color: var(--muted);
        background: transparent;
        border: 0;
        cursor: pointer;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .chapter-index button:hover {
        color: var(--green);
      }

      .chapter-section {
        padding: 31px 0 35px;
        border-bottom: 1px solid var(--line);
        scroll-margin-top: 18px;
      }

      .section-heading {
        display: grid;
        grid-template-columns: 54px minmax(0, 1fr);
        gap: 15px;
        align-items: baseline;
        margin-bottom: 18px;
      }

      .section-number {
        color: var(--green);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.08em;
      }

      .section-heading h3 {
        margin: 0;
        font-family: "Iowan Old Style", "Songti SC", "STSong", serif;
        font-size: 25px;
        line-height: 1.25;
      }

      .section-lead {
        max-width: 900px;
        margin: -7px 0 20px 69px;
        color: var(--muted);
        font-size: 13px;
      }

      .scope-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 32px;
        margin-left: 69px;
      }

      .scope-item {
        padding-top: 12px;
        border-top: 2px solid var(--ink);
      }

      .scope-label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 850;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .scope-item p,
      .scope-item ul {
        margin: 0;
        font-size: 13px;
      }

      .plain-list {
        padding-left: 18px;
      }

      .plain-list li + li {
        margin-top: 5px;
      }

      .collection-summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin: 0 0 22px 69px;
        border-top: 2px solid var(--ink);
        border-bottom: 1px solid var(--line);
      }

      .summary-stat {
        min-height: 84px;
        padding: 14px 13px 12px 0;
      }

      .summary-stat + .summary-stat {
        padding-left: 16px;
        border-left: 1px solid var(--line);
      }

      .summary-stat strong {
        display: block;
        font-family: "Iowan Old Style", "Songti SC", "STSong", serif;
        font-size: 25px;
        line-height: 1.1;
      }

      .summary-stat span {
        color: var(--muted);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.05em;
      }

      .evidence-wrap {
        margin-left: 69px;
        overflow-x: auto;
        border-top: 2px solid var(--ink);
      }

      .evidence-table {
        width: 100%;
        min-width: 830px;
        border-collapse: collapse;
        table-layout: fixed;
      }

      .evidence-table th {
        padding: 10px 11px 9px 0;
        color: var(--muted);
        border-bottom: 1px solid var(--line-strong);
        font-size: 9px;
        font-weight: 850;
        letter-spacing: 0.07em;
        text-align: left;
        vertical-align: bottom;
      }

      .evidence-table td {
        padding: 15px 14px 15px 0;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        line-height: 1.62;
        vertical-align: top;
      }

      .evidence-table th:nth-child(1),
      .evidence-table td:nth-child(1) { width: 18%; }
      .evidence-table th:nth-child(2),
      .evidence-table td:nth-child(2) { width: 42%; }
      .evidence-table th:nth-child(3),
      .evidence-table td:nth-child(3) { width: 13%; }
      .evidence-table th:nth-child(4),
      .evidence-table td:nth-child(4) { width: 27%; }

      .source-date,
      .source-meta,
      .locator {
        display: block;
        color: var(--muted);
        font-size: 9px;
        line-height: 1.55;
      }

      .source-title {
        display: block;
        margin: 3px 0;
        font-weight: 800;
        line-height: 1.45;
      }

      .evidence-claim {
        color: var(--ink);
        font-family: "Iowan Old Style", "Songti SC", "STSong", serif;
        font-size: 13px;
        font-weight: 650;
      }

      .effect {
        display: inline-block;
        padding: 3px 7px;
        color: var(--green);
        background: var(--green-soft);
        border-radius: 999px;
        font-size: 9px;
        font-weight: 850;
        white-space: nowrap;
      }

      .effect.refute {
        color: var(--red);
        background: #f4e5e2;
      }

      .effect.boundary {
        color: var(--amber);
        background: var(--amber-soft);
      }

      .review-mark {
        display: block;
        margin-top: 7px;
        color: var(--green);
        font-size: 9px;
        font-weight: 800;
      }

      .analysis-flow {
        margin: 0 0 0 69px;
        padding: 0;
        list-style: none;
        counter-reset: analysis-step;
      }

      .analysis-flow li {
        position: relative;
        display: grid;
        grid-template-columns: 45px minmax(0, 1fr);
        gap: 16px;
        padding: 0 0 24px;
        counter-increment: analysis-step;
      }

      .analysis-flow li::before {
        display: grid;
        width: 35px;
        height: 35px;
        place-items: center;
        color: var(--surface);
        background: var(--green);
        border-radius: 50%;
        content: counter(analysis-step, decimal-leading-zero);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 9px;
        font-weight: 850;
      }

      .analysis-flow li:not(:last-child)::after {
        position: absolute;
        top: 36px;
        bottom: 0;
        left: 17px;
        width: 1px;
        background: var(--line-strong);
        content: "";
      }

      .analysis-flow strong {
        display: block;
        margin-bottom: 4px;
        font-family: "Iowan Old Style", "Songti SC", "STSong", serif;
        font-size: 16px;
      }

      .analysis-flow p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .logic-result {
        margin: 2px 0 0 69px;
        padding: 17px 20px;
        color: #e9f2ee;
        background: #183c31;
        border-radius: 7px;
        font-family: "Iowan Old Style", "Songti SC", "STSong", serif;
        font-size: 16px;
        font-weight: 650;
      }

      .rollup-table {
        width: calc(100% - 69px);
        margin-left: 69px;
        border-collapse: collapse;
        border-top: 2px solid var(--ink);
      }

      .rollup-table th,
      .rollup-table td {
        padding: 13px 12px 13px 0;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        text-align: left;
        vertical-align: top;
      }

      .rollup-table th {
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.06em;
      }

      .rollup-link {
        padding: 0;
        color: var(--green);
        background: transparent;
        border: 0;
        font-weight: 800;
        cursor: pointer;
        text-align: left;
      }

      .conclusion-block {
        margin-left: 69px;
        padding: 22px 0 4px;
        border-top: 3px solid var(--green);
      }

      .answer {
        max-width: 890px;
        margin-bottom: 20px;
        font-family: "Iowan Old Style", "Songti SC", "STSong", serif;
        font-size: 21px;
        font-weight: 700;
        line-height: 1.62;
      }

      .judgment-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 30px;
      }

      .judgment-grid > div {
        padding-top: 11px;
        border-top: 1px solid var(--line-strong);
        font-size: 12px;
      }

      .judgment-grid strong {
        display: block;
        margin-bottom: 5px;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.06em;
      }

      .process-note {
        margin: 0 0 20px 69px;
        padding: 11px 14px;
        color: var(--amber);
        background: var(--amber-soft);
        border-left: 3px solid #c58a28;
        font-size: 11px;
      }

      .research-abstract {
        margin: 26px 0 2px;
        padding: 20px 23px 22px;
        color: #ecf4f0;
        background: #183c31;
        border-left: 5px solid #d3a149;
      }

      .research-abstract span {
        display: block;
        margin-bottom: 7px;
        color: #b8d1c5;
        font-size: 9px;
        font-weight: 850;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .research-abstract p {
        max-width: 950px;
        margin: 0;
        font-family: "Iowan Old Style", "Songti SC", "STSong", serif;
        font-size: 19px;
        font-weight: 650;
        line-height: 1.7;
      }

      .metric-ribbon {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin: 0 0 26px 69px;
        border-top: 3px solid var(--ink);
        border-bottom: 1px solid var(--line-strong);
      }

      .metric-cell {
        min-height: 126px;
        padding: 17px 14px 14px 0;
      }

      .metric-cell + .metric-cell {
        padding-left: 17px;
        border-left: 1px solid var(--line);
      }

      .metric-value {
        display: block;
        margin-bottom: 7px;
        color: var(--green);
        font-family: "Iowan Old Style", "Songti SC", "STSong", serif;
        font-size: clamp(21px, 2.2vw, 31px);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.05;
      }

      .metric-label {
        display: block;
        color: var(--ink);
        font-size: 10px;
        font-weight: 850;
        line-height: 1.45;
      }

      .metric-note {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 9px;
        line-height: 1.45;
      }

      .metric-note a {
        font-weight: 700;
      }

      .article-copy {
        max-width: 910px;
        margin-left: 69px;
      }

      .article-copy section + section {
        margin-top: 31px;
        padding-top: 28px;
        border-top: 1px solid var(--line);
      }

      .article-copy h4 {
        margin: 0 0 13px;
        color: var(--ink);
        font-family: "Iowan Old Style", "Songti SC", "STSong", serif;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.35;
      }

      .article-copy h4::before {
        display: inline-block;
        width: 18px;
        height: 2px;
        margin: 0 10px 6px 0;
        background: var(--green);
        content: "";
      }

      .article-copy p {
        margin-bottom: 13px;
        color: #26332d;
        font-family: "Iowan Old Style", "Songti SC", "STSong", serif;
        font-size: 15px;
        line-height: 1.95;
        text-align: justify;
      }

      .article-copy p:last-child {
        margin-bottom: 0;
      }

      .article-copy a {
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 0.78em;
        font-weight: 800;
        white-space: nowrap;
      }

      .inline-cite {
        display: inline-block;
        margin-left: 4px;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 10px;
        font-style: normal;
        vertical-align: 0.08em;
      }

      .parent-bridge {
        margin: 30px 0 0 69px;
        padding: 15px 18px;
        color: #493b23;
        background: #f6ebd1;
        border-left: 3px solid #c58a28;
        font-size: 12px;
        line-height: 1.75;
      }

      .parent-bridge strong {
        display: block;
        margin-bottom: 4px;
        color: var(--amber);
        font-size: 9px;
        letter-spacing: 0.07em;
      }

      .evidence-caption {
        margin: 28px 0 9px 69px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .pass {
        color: var(--green);
        font-weight: 850;
      }

      .fail {
        color: var(--red);
        font-weight: 850;
      }

      .generated-children {
        display: grid;
        gap: 7px;
      }

      .child-jump {
        display: grid;
        grid-template-columns: 70px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        width: 100%;
        padding: 11px 13px;
        color: var(--ink);
        background: #f6f3ea;
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
        text-align: left;
      }

      .child-jump:hover {
        border-color: var(--green);
      }

      .child-jump code {
        color: var(--green);
        font-size: 10px;
        font-weight: 850;
      }

      .child-jump span {
        font-size: 12px;
        font-weight: 700;
      }

      .child-jump::after {
        color: var(--green);
        content: "→";
      }

      .audit-footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px 24px;
        margin-top: 22px;
        padding: 15px 3px 0;
        color: var(--muted);
        border-top: 1px solid var(--line-strong);
        font-size: 10px;
      }

      .audit-links a + a::before {
        margin: 0 7px;
        color: var(--line-strong);
        content: "/";
      }

      @media (max-width: 960px) {
        .workspace {
          grid-template-columns: 260px minmax(0, 1fr);
        }

        .detail-pane {
          padding: 30px 27px;
        }

        .tree-pane {
          padding: 19px 13px;
        }

      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 18px, 1440px);
          padding-top: 22px;
        }

        .report-header,

                "对未来 0–2 年，已签承诺意味着需求突然归零的可能性较低；对 3–5 年，合同到期、客户融资和终端变现能力的重要性会上升。集中度越高，行业就越可能表现为“平时能见度很好、压力情景下回撤很快”。",
                "所以本节点既不接受“有 take-or-pay 就没有风险”，也不接受“客户集中就等于泡沫”。最合理的结论是：近期合同保护较强，远期存在真实的非线性回撤风险，需要持续跟踪客户融资、合同修改、项目延期和容量利用率。"

            }
          ],
          parentBridge: "本节点告诉 L2.5：合同把近期需求锁住，但也把风险集中到少数对手方；父节点必须把融资与利用率作为中期 S 曲线的条件。"
        },
        "AFD-L3-5-3": {
          kind: "leaf",
          thesis: "单位推理成本和 GPU 使用效率正在快速改善，但截至当前，任务量、云收入和新增容量变现的增长更快，总需求净方向仍偏正。效率会降低长期需求斜率并扩大预测区间，现有数据不足以估计跨厂商、跨工作负载的精确价格弹性。",
          metrics: [
            { value: "$20→$0.07", label: "近似 GPT-3.5 能力推理价格", note: "每百万 token，约下降 99.65%", source: "stanford2025" },
            { value: "4×", label: "Microsoft Copilot 吞吐提升", note: "同年新增容量仍快速变现", source: "microsoft" },
            { value: "-84%至-89%", label: "部分工作负载 GPU 成本", note: "Dynamics / PowerPoint", source: "microsoft" },
            { value: "-20%", label: "IEA 高效率情景相对基准用电", note: "2035 年敏感性结果", source: "iea" }
          ],
          sections: [
            {
              title: "第一性原理：总需求取决于单位资源与任务量的乘积",
              paragraphs: [

                "Stanford AI Index 显示，达到近似 GPT-3.5 能力的推理价格由 2022 年每百万 token 20 美元降至 2024 年 0.07 美元，约下降 99.65%，或便宜约 286 倍。{{stanford2025}} 这一指标还受模型结构与市场定价影响，不是纯硬件能效，但足以证明用户面对的单位智能成本发生了数量级下降。"
              ]
            },
            {
              title: "当前观测：效率改善与总使用增长同时发生",
              paragraphs: [
                "Microsoft 年内将 Copilot 工作负载吞吐提高 4 倍，并将部分 Dynamics / PowerPoint 工作负载的 GPU 成本降低 84%–89%；同一时期 Azure 增长 43%，新增容量仍能快速变现。{{microsoft}} 如果效率提升只带来算力节省而没有新使用，平台容量需求理应走弱；实际数据却显示效率和收入、容量利用同步增长。",
                "Amazon 的证据方向相同：Trainium 代际持续提升价格性能，但 Trainium2 大体售罄、Trainium3 近乎满订，Bedrock Q1 token 量超过此前所有年份合计。{{amazonLetter}} 这说明至少在当前阶段，价格性能提升释放的新工作负载超过了单位任务资源下降带来的压缩。"
              ]
            },
            {
              title: "为什么不能直接宣布 Jevons 效应永久成立",
              paragraphs: [
                "上述证据来自不同产品和不同指标：吞吐、GPU 成本、Azure 收入、Trainium 预订和 Bedrock token 没有共同基期，也无法建立统一价格—使用曲线。它们足以判断方向，却不足以估算需求弹性，更不能证明任务量会永远以快于效率的速度增长。",
                "IEA 的高效率情景显示，2035 年数据中心用电可能比基准情景低 20%，全部情景范围约 700–1700 TWh。{{iea}} 这说明效率对长期实物需求有实质影响。即便总需求继续增长，其斜率、设备更新节奏和电力强度仍可能明显低于基准。"
              ]
            },
            {
              title: "净判断：当前弹性偏正，长期幅度未知",
              paragraphs: [
                "现有证据支持一个有限结论：单位智能成本快速下降的同时，token、云收入和容量使用增长更快，净需求方向仍偏正。效率更像是在降低单位成本、打开新场景，并部分压低基础设施增速，而不是立即令总需求见顶。",
                "本节点不继续下钻，是因为缺少精确弹性并不会改变当前方向判断；但它会限制五年预测的精度。未来应以同一平台、同一工作负载的单位成本和总 token / 收入序列为优先监测数据，一旦任务量增速持续低于单位资源下降，父节点的中期结论就需要下调。"
              ]
            }
          ],
          parentBridge: "本节点告诉 L2.5：效率目前没有抵消总需求，但足以改变中期斜率；父结论应采用条件性增长和情景区间，不能线性外推。"
        }
      };

      const nodeById = new Map(nodes.map((node) => [node.id, node]));
      const childrenByParent = new Map();

      nodes.forEach((node) => {
        const key = node.parent || "root";
        const siblings = childrenByParent.get(key) || [];
        siblings.push(node);
        childrenByParent.set(key, siblings);
      });

      function treeMarkup(parentId) {
        const children = childrenByParent.get(parentId || "root") || [];
        if (!children.length) return "";
        return `<ul class="tree-list">${children.map((node) => `
          <li>
            <button class="tree-item" type="button" data-target="${node.id}" aria-selected="false">
              <span class="tree-level">${node.level}</span>
              <span class="tree-question">${node.short}</span>
              <span class="tree-status${node.expanded ? " was-expanded" : ""}" aria-label="${node.status}"></span>
            </button>
            ${treeMarkup(node.id)}
          </li>`).join("")}
        </ul>`;
      }

      function breadcrumb(node) {
        const path = [];
        let current = node;
        while (current) {
          path.unshift(`<span>${current.level} ${current.short}</span>`);
          current = current.parent ? nodeById.get(current.parent) : null;
        }
        return path.join("");
      }

      function childMarkup(node) {
        const children = childrenByParent.get(node.id) || [];
        if (!children.length) return "不需要。当前证据足以回答本节点。";
        return `<div class="generated-children">${children.map((child) => `
          <button class="child-jump" type="button" data-jump="${child.id}">
            <code>${child.level}</code>
            <span>${child.question}</span>
          </button>`).join("")}
        </div>`;
      }

      function listMarkup(items) {
        return `<ul class="plain-list">${items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
      }

      function effectLabel(effect) {
        return { support: "支持", refute: "反证", boundary: "边界" }[effect] || effect;
      }

      function evidenceRows(nodeId) {
        const evidence = evidenceByNode[nodeId] || [];
        return evidence.map((item) => {
          const [title, url] = sources[item.source];
          const meta = sourceMeta[item.source];
          return `
            <tr>
              <td>
                <span class="source-date">${meta.date}</span>
                <a class="source-title" href="${url}">${title}</a>
                <span class="source-meta">${meta.type} · ${meta.publisher}</span>
                <span class="locator">定位：${item.locator}</span>
              </td>
              <td>
                <span class="evidence-claim">${item.claim}</span>
                <span class="review-mark">✓ 已逐问题抽取并复核 · ${item.trace}</span>
              </td>
              <td><span class="effect ${item.effect}">${effectLabel(item.effect)}</span></td>
              <td>${item.caveat}</td>
            </tr>`;
        }).join("");
      }

      function evidenceMarkup(node, chapter) {
        const evidence = evidenceByNode[node.id] || [];
        if (chapter.mode === "rollup") {
          const children = childrenByParent.get(node.id) || [];
          return `
            <p class="process-note">${chapter.note}</p>
            <table class="rollup-table">
              <thead><tr><th>输入节点</th><th>已验证的子结论</th><th>节点状态</th></tr></thead>
              <tbody>${children.map((child) => `
                <tr>
                  <td><button class="rollup-link" type="button" data-jump="${child.id}">${child.level} · ${child.short}</button></td>
                  <td>${child.conclusion}</td>
                  <td><span class="pass">${child.status}</span></td>
                </tr>`).join("")}</tbody>
            </table>`;
        }
        return `
          <p class="evidence-caption">原始证据底稿 · ${node.id} × ${evidence.length} 条逐问题抽取 · 每条均保留原文位置、口径限制和复核编号</p>
          <div class="evidence-wrap" tabindex="0" aria-label="${node.id} 关键证据表">
            <table class="evidence-table">
              <thead><tr><th>材料与原文定位</th><th>抽取的关键数据 / 事实</th><th>作用</th><th>口径限制与反向解释</th></tr></thead>
              <tbody>${evidenceRows(node.id)}</tbody>
            </table>
          </div>`;
      }

      function richText(text) {
        return text.replace(/\{\{([a-zA-Z0-9]+)\}\}/g, (_, key) => {
          if (!sources[key]) return "";
          const [label, url] = sources[key];
          return `<cite class="inline-cite">〔<a href="${url}">${label}</a>〕</cite>`;
        });
      }

      function metricMarkup(article) {
        if (!article.metrics?.length) return "";
        return `<div class="metric-ribbon">${article.metrics.map((metric) => {
          const citation = metric.source && sources[metric.source]
            ? `<a href="${sources[metric.source][1]}">${sources[metric.source][0]}</a>`
            : "研究台账";
          return `
            <div class="metric-cell">
              <span class="metric-value">${metric.value}</span>
              <span class="metric-label">${metric.label}</span>
              <span class="metric-note">${metric.note} · ${citation}</span>
            </div>`;
        }).join("")}</div>`;
      }

      function articleMarkup(article) {
        return `
          <div class="article-copy">${article.sections.map((section) => `
            <section>
              <h4>${section.title}</h4>
              ${section.paragraphs.map((paragraph) => `<p>${richText(paragraph)}</p>`).join("")}
            </section>`).join("")}
          </div>
          ${article.parentBridge ? `<div class="parent-bridge"><strong>对父问题的贡献</strong>${article.parentBridge}</div>` : ""}`;
      }

      function scopeMarkup(node, chapter) {
        return `
          <div class="scope-grid">
            <div class="scope-item"><span class="scope-label">本层要回答</span><p>${node.what}</p></div>
            <div class="scope-item"><span class="scope-label">通过标准</span><p>${chapter.rule}</p></div>
            <div class="scope-item"><span class="scope-label">预先规定的数据</span>${listMarkup(chapter.required)}</div>
            <div class="scope-item"><span class="scope-label">实际展开的子问题</span>${childMarkup(node)}</div>
          </div>`;
      }

      function detailMarkup(node) {
        const chapter = chapterByNode[node.id];
        const article = articleByNode[node.id];
        const isParent = article.kind === "parent";
        const scopeTitle = isParent ? "汇总问题与口径" : "研究问题与口径";
        const dataTitle = isParent ? "下层结论与汇总依据" : "核心数据与原始证据";
        const analysisTitle = isParent ? "综合分析" : "分析正文";
        return `
          <article class="node-detail" data-active-node="${node.id}">
            <p class="breadcrumb">${breadcrumb(node)}</p>
            <div class="detail-title-row">
              <div>
                <p class="node-id">${node.id}</p>
                <h2 class="detail-title">${node.question}</h2>
              </div>
              <span class="status-badge${node.expanded ? " expanded" : ""}">${node.status}</span>
            </div>
            <div class="research-abstract"><span>${isParent ? "Synthesis view" : "Research conclusion"}</span><p>${article.thesis}</p></div>
            <nav class="chapter-index" aria-label="本节点章节目录">
              <button type="button" data-section="scope-${node.id}">01 ${scopeTitle}</button>
              <button type="button" data-section="data-${node.id}">02 ${dataTitle}</button>
              <button type="button" data-section="analysis-${node.id}">03 ${analysisTitle}</button>
              <button type="button" data-section="conclusion-${node.id}">04 结论与充分性</button>
            </nav>
            <section class="chapter-section" id="scope-${node.id}">
              <div class="section-heading"><span class="section-number">01</span><h3>${scopeTitle}</h3></div>
              ${scopeMarkup(node, chapter)}
            </section>
            <section class="chapter-section" id="data-${node.id}">
              <div class="section-heading"><span class="section-number">02</span><h3>${dataTitle}</h3></div>
              ${metricMarkup(article)}
              ${evidenceMarkup(node, chapter)}
            </section>
            <section class="chapter-section" id="analysis-${node.id}">
              <div class="section-heading"><span class="section-number">03</span><h3>${analysisTitle}</h3></div>
              ${articleMarkup(article)}
            </section>
            <section class="chapter-section" id="conclusion-${node.id}">
              <div class="section-heading"><span class="section-number">04</span><h3>结论与充分性判断</h3></div>
              <div class="conclusion-block">
                <p class="answer">${node.conclusion}</p>
                <div class="judgment-grid">
                  <div><strong>SUFFICIENCY · 是否回答充分</strong>${node.sufficiency}</div>
                  <div><strong>NEXT · 后续动作</strong>${node.next_action || (node.expanded ? "子节点已完成；未来按关键风险指标刷新。" : "关闭当前分支；当关键指标或反证变化时重新打开。")}</div>
                </div>
              </div>
            </section>
          </article>`;
      }

      const treeRoot = document.getElementById("question-tree");
      const detailPane = document.getElementById("detail-pane");
      treeRoot.innerHTML = treeMarkup(null);

      function ancestors(nodeId) {
        const result = new Set();
        let current = nodeById.get(nodeId);
        while (current && current.parent) {
          result.add(current.parent);
          current = nodeById.get(current.parent);
        }
        return result;
      }

      function showNode(requestedId, updateHash = true) {
        const node = nodeById.get(requestedId) || nodeById.get("AFD-L1");
        const path = ancestors(node.id);
        document.querySelectorAll(".tree-item").forEach((button) => {
          const isActive = button.dataset.target === node.id;
          button.classList.toggle("is-active", isActive);
          button.classList.toggle("is-on-path", path.has(button.dataset.target));
          button.setAttribute("aria-selected", String(isActive));
        });
        detailPane.innerHTML = detailMarkup(node);
        detailPane.querySelectorAll("[data-jump]").forEach((button) => {
          button.addEventListener("click", () => showNode(button.dataset.jump));
        });
        detailPane.querySelectorAll("[data-section]").forEach((button) => {
          button.addEventListener("click", () => {
            document.getElementById(button.dataset.section)?.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        });
        if (updateHash) {
          detailPane.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        if (updateHash && window.location.hash !== `#${node.id}`) {
          history.replaceState(null, "", `#${node.id}`);
        }
      }

      treeRoot.addEventListener("click", (event) => {
        const button = event.target.closest(".tree-item");
        if (button) showNode(button.dataset.target);
      });

      window.addEventListener("hashchange", () => showNode(window.location.hash.slice(1), false));
      showNode(window.location.hash.slice(1) || "AFD-L1", false);
    </script>
  </body>
</html>
